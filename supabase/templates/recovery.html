<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#111">
  <h2 style="font-weight:500;margin:0 0 12px">Reset your password</h2>
  <p style="margin:0 0 20px;line-height:1.5">Someone (hopefully you) asked to reset the password for {{ .Email }}.</p>
  <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password" style="display:inline-block;background:#2a78d6;color:#fff;text-decoration:none;padding:12px 20px;border-radius:999px">Set a new password</a></p>
  <p style="margin:0;font-size:13px;color:#666;line-height:1.5">The link works once and expires in 1 hour. If you didn't ask for this, you can ignore this email.</p>
</div>
